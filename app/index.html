<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>pve studio</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="data:," />
<link rel="stylesheet" href="/src/ui/daw.css" />
</head>
<body>
<div class="nle-app" id="app">
  <!-- Top WinForms Menu Bar -->
  <header class="nle-menubar">
    <div class="nle-brand">
      <span>PVE</span>
      <span class="nle-brand-badge">STUDIO</span>
    </div>
    <button class="nle-menu-item" id="menu-loop">Loop Clip (L)</button>
    <button class="nle-menu-item active" id="menu-follow">Follow (F)</button>
    <div class="nle-menubar-right">
      <button class="nle-menu-item" id="menu-fullscreen" title="Toggle Fullscreen Preview (F11)">Fullscreen (F11)</button>
      <button class="nle-menu-item active" id="menu-notes">Notes (N)</button>
    </div>
  </header>

  <!-- Program Monitor Stage GroupBox -->
  <div class="group-box nle-stage-dock">
    <div class="group-box-title">
      <span>Program Monitor</span>
      <strong style="color:var(--sys-accent)">[16:9 · 1080p]</strong>
      <span class="nle-title-sep">·</span>
      <span id="monitor-fps" style="color:#4ade80">60.0 FPS</span>
      <span class="nle-title-sep">·</span>
      <span id="monitor-ms" style="color:var(--sys-text-muted)">16.6 ms</span>
    </div>
    <div class="nle-stage-row">
      <main class="nle-stage" id="stage">
        <div class="nle-canvas-frame" id="canvas-frame">
          <canvas id="c"></canvas>
          <div class="nle-snippet-overlay hidden" id="snippet-overlay">
            <div class="nle-snippet-marquee hidden" id="snippet-marquee"></div>
            <div class="nle-snippet-hint">Select region: Drag rectangle over frame · Press Escape to cancel</div>
          </div>
        </div>
      </main>
      <aside class="nle-notes-pane" id="notes-pane">
        <div class="nle-notes-header">
          <div class="nle-notes-title">
            <span>NOTES</span>
            <span class="nle-hash-badge" id="notes-hash-badge">#init</span>
            <span class="nle-chip nle-chip--ok" id="notes-save-chip">● SAVED</span>
          </div>
          <button class="nle-btn-icon" id="btn-note-close" title="Close Notes (N)">✕</button>
        </div>
        <div class="nle-notes-bar">
          <select class="nle-notes-select" id="notes-select"></select>
          <button id="btn-note-new" title="New Note with random hash">+ New</button>
          <button class="nle-btn daw-tbtn--danger" id="btn-note-delete" title="Delete Active Note">Del</button>
        </div>
        <div class="nle-notes-tools">
          <button id="btn-note-undo" title="Undo (Ctrl+Z)" disabled>Undo</button>
          <button id="btn-note-redo" title="Redo (Ctrl+Y)" disabled>Redo</button>
          <button id="btn-note-snippet" title="Select frame region and insert note (S)">Region (S)</button>
          <button id="btn-note-time" title="Insert current timecode block">Time</button>
        </div>
        <div class="nle-notes-body" id="notes-editor-container"></div>
        <div class="nle-notes-footer">
          <span class="nle-notes-path" id="notes-file-path">projects/.../video/notes/</span>
          <span class="nle-notes-stats" id="notes-stats">0L · 0W · 0C</span>
        </div>
      </aside>
    </div>
  </div>

  <!-- Hardware Transport Bar (VFD/LCD rackmount) -->
  <div id="transport-container"></div>

  <!-- NLE Multi-Track Timeline GroupBox -->
  <div class="group-box nle-timeline-dock" id="timeline-dock">
    <div class="group-box-title">
      <span>Timeline</span>
      <strong style="color:#f59e0b" id="tl-title-info">[30 fps · 200 BPM]</strong>
      <button class="nle-metronome-btn" id="btn-metronome" title="Toggle Metronome click (M)">
        <svg width="10" height="10" viewBox="0 0 16 16" fill="currentColor"><path d="M7 1a1 1 0 0 1 2 0v1.077l3.87 11.61A1 1 0 0 1 11.92 15H4.08a1 1 0 0 1-.95-1.313L7 2.077V1zm1 3.123L5.374 13h5.252L8 4.123zM8 7a1 1 0 0 1 1 1v2a1 1 0 1 1-2 0V8a1 1 0 0 1 1-1z"/></svg>
        <span>METRO</span>
        <span class="nle-metro-dot" id="metro-beat-dot">●</span>
      </button>
    </div>
    <div class="nle-timeline-body">
      <!-- Left Track Headers -->
      <div class="nle-track-headers">
        <div class="nle-track-header nle-track-header--ruler"><span>RULER</span><span style="color:#fbbf24;font-size:8px">BARS</span></div>
        <div class="nle-track-header nle-track-header--clips"><span>CLIPS</span><span style="color:#38bdf8;font-size:8px">VIDEO</span></div>
        <div class="nle-track-header nle-track-header--over"><span>OVER</span><span style="color:#a78bfa;font-size:8px">TRANS</span></div>
        <div class="nle-track-header nle-track-header--sections"><span>SECTIONS</span><span style="color:#94a3b8;font-size:8px">EDL</span></div>
        <div class="nle-track-header nle-track-header--lyrics"><span>LYRICS</span><span style="color:#f59e0b;font-size:8px">SYNC</span></div>
        <div class="nle-track-header nle-track-header--wave"><span>AUDIO</span><span style="color:#208b7e;font-size:8px">RMS</span></div>
        <div class="nle-track-header nle-track-header--overview"><span>MAP</span><span style="color:#64748b;font-size:8px">100%</span></div>
      </div>

      <!-- Right Timeline Canvas Viewport -->
      <div class="nle-timeline-viewport" id="timeline-viewport">
        <canvas id="timeline-canvas"></canvas>
      </div>
    </div>
  </div>

  <!-- Error strip -->
  <pre class="nle-err-strip" id="errs"></pre>
</div>

<script type="module" src="/src/boot.ts"></script>
</body>
</html>
